name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test ./... -race -cover

  # Builds the image on every PR and publishes it from main. `needs: test` is
  # the platform's CI gate (assist `testing-and-ci-gate`, §3): nothing reaches
  # ghcr — and therefore the box — that did not pass `go vet` + the race suite.
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release-please creates its tag and release with GITHUB_TOKEN, and
      # GitHub's anti-recursion rule means that push never starts a workflow —
      # so `on: push: tags:` would never fire and :X.Y.Z would never be built.
      # The version is therefore read off the release commit as it lands on
      # main, the same way servicebay's release.yml does it.
      - name: Resolve image version
        id: ver
        env:
          IS_RELEASE: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(main): release') }}"
        run: |
          set -euo pipefail
          released=$(jq -r '."."' .release-please-manifest.json)
          if [ "$IS_RELEASE" = true ]; then
            echo "release=$released" >> "$GITHUB_OUTPUT"
            echo "majmin=${released%.*}" >> "$GITHUB_OUTPUT"
            echo "label=$released" >> "$GITHUB_OUTPUT"
          else
            # Not a release build, so it must not claim a released version.
            echo "label=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.release }},enable=${{ steps.ver.outputs.release != '' }}
            type=raw,value=${{ steps.ver.outputs.majmin }},enable=${{ steps.ver.outputs.majmin != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          # ServiceBay's box-verify identifies a running container by
          # org.opencontainers.image.revision and .version — an image without
          # them is one nobody can trace back to a commit.
          labels: |
            org.opencontainers.image.title=usage-metrics
            org.opencontainers.image.description=Aggregate, anonymous usage counters for household apps — POST /ingest, SQLite storage, retention sweep.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.ver.outputs.label }}

      # amd64 only, deliberately: the box this service is built for is amd64,
      # and an arm64 leg would double build time for a platform nothing here
      # runs. Add linux/arm64 here on the day an arm box appears.
      - name: Build image (load, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: usage-metrics:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image before it can become :latest. A distroless binary that
      # fails to start would otherwise only surface as a failed install on the
      # box, hours later.
      - name: Smoke-test the image (boots and answers /healthz)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 18080:8080 \
            -e USAGE_METRICS_TOKEN=smoke-token \
            -e USAGE_METRICS_DB_PATH=/tmp/usage-metrics.db \
            usage-metrics:smoke
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke >/dev/null
          [ -n "$ok" ]

      # Cache-only re-export of the layers built above, so this is a push, not
      # a second compile.
      - name: Push image (smoke test passed)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
